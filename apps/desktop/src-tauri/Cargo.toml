[package]
name = "warsha-desktop"
version = "0.3.1"
edition = "2021"
description = "Warsha desktop shell — Tauri 2 window around the warshad daemon"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

# This package is deliberately its own workspace: `apps/desktop/src-tauri` is not a member of
# the root cargo workspace (the validation gate builds `crates/**` only), and a standalone
# package inside another workspace's directory has to say so or cargo refuses to resolve it.
[workspace]

[lib]
name = "warsha_desktop_lib"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "warsha-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what `app.macOSPrivateApi` in tauri.conf.json compiles against.
# The frontend reaches the daemon over loopback HTTP/WebSocket and calls the shell's own
# `get_config`, `set_config`, and `pick_folder` commands; `tauri-plugin-opener` handles
# external links and `tauri-plugin-dialog` backs the native folder picker (`dialog:default`).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
warshad = { path = "../../../crates/warshad" }
