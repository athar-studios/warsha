<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` is here because the phone's navigation is sticky at the block end and
      `src/index.css` keeps it clear of the home indicator with `env(safe-area-inset-bottom)` — which
      reads as zero unless the document opts into the display cutout.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ورشة — Warsha Remote</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <!--
      The manifest is the install candidate; these three are what a manifest cannot carry. iOS ignores
      the manifest's `icons` and reads `apple-touch-icon` instead, and a phone installed from the share
      sheet still reads the `*-web-app-capable` hints. The files live in `public/icons/` — Vite copies
      `public/` verbatim, so they reach `dist/` exactly as committed — and are generated from the same
      plate the desktop bundler ships by `scripts/make-icons.py`.
    -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ورشة">
    <!--
      The browser chrome follows the bench's own plates (`--warsha-color-bg`: #fafafa light, #0e0e0e
      dark), not a brand blue. That is the platform's status bar, not the app's theme: the theme stays an
      owner choice written to `data-theme` by `src/theme.tsx`, and `tokens.css` never asks the device
      which palette to paint (docs/design/REDESIGN.md §12).
    -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
    <meta name="description" content="ورشة — طاولة العمل عن بُعد">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
