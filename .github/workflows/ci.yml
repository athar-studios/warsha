name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Rust: fmt, clippy, test, cargo-deny, gitleaks
  # ============================================================
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite3 pkg-config

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy -D warnings --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: .gitleaks.toml

  # ============================================================
  # TypeScript: lint, typecheck, test, build
  # ============================================================
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.4

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # docs/ARCH_RULES.md, enforced by scripts/check-arch.mjs. Runs before Test because a
      # boundary breach should fail fast, and runs its own fixture self-test first so a silently
      # broken rule can never report a clean tree.
      - name: Architecture boundaries
        run: |
          node scripts/check-arch.mjs --self-test
          node scripts/check-arch.mjs

      - name: Test
        run: pnpm -r test

      # The visual suite starts both dev servers itself (playwright.config.ts webServer), screenshots
      # all 56 desktop cases plus the remote smoke check against the baselines committed beside them,
      # and fails on any layout invariant or pixel diff. The browsers are the same Linux chromium the
      # baselines were generated with, so the comparison is exact.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual regression
        run: pnpm visual

      - name: Build
        run: pnpm build

  # ============================================================
  # CodeQL Analysis
  # ============================================================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality

      - name: Build (Rust)
        if: matrix.language == 'rust'
        run: cargo build --workspace

      - name: Build (TypeScript)
        if: matrix.language == 'javascript-typescript'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================================
  # Actionlint - validate workflow files
  # ============================================================
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: rhysd/actionlint@v1

  # ============================================================
  # Summary
  # ============================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [rust, typescript, codeql, actionlint]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.rust.result }}" != "success" ]]; then echo "Rust failed"; exit 1; fi
          if [[ "${{ needs.typescript.result }}" != "success" ]]; then echo "TypeScript failed"; exit 1; fi
          if [[ "${{ needs.codeql.result }}" != "success" ]]; then echo "CodeQL failed"; exit 1; fi
          if [[ "${{ needs.actionlint.result }}" != "success" ]]; then echo "Actionlint failed"; exit 1; fi
          echo "All checks passed!"