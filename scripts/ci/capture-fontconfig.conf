<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Warsha capture fontconfig — the AA mode the visual baselines were rendered with.

  Why this file exists (B4, 2026-11-03): the desktop/remote pixel baselines beside
  apps/desktop/e2e/*.spec.ts-snapshots carry LCD-subpixel glyph fringes (rgba=rgb, lcdfilter=lcddefault,
  hinting=hintslight) because the WSL capture host drew them that way. A plain Linux host — a fresh CI
  runner, or this server with no user-level fragment — defaults to grayscale AA, and every light-theme
  case then fails on text AA alone (measured: 10k–25k diff pixels per frame, magnitudes up to 765, versus
  0–944 px at one level once the mode matches). That is a rendering-config gap, not a design change.

  This file is the reproducible pin the gates/onboarding/run lane decisions asked for:
  playwright.config.ts points chromium's FONTCONFIG_FILE at it (after validating the value it gets),
  so every capture — local or CI — starts from the system config (/etc/fonts/fonts.conf, and with it
  the pinned faces installed by scripts/ci/install-capture-fonts.sh; with the font dirs as an
  explicit fallback when a host has no system config) and then has these five axes assigned last,
  winning over any stray user or distro drop-in. The values are exactly the fragment that was proven
  on this host: the byte-exact-passing controls stay byte-exact with it, so no baseline's intent
  moves. Linux-only:
  macOS and Windows chromium never read fontconfig, and playwright.config.ts does not set the env
  variable there.
-->
<fontconfig>
  <!-- Everything the host genuinely has: font dirs, aliases, pinned capture faces, distro conf.d.
       Tolerated when absent, because a strict include that fails discards this whole file: fontconfig
       then logs "Cannot load default config file" and falls back to its built-in config — a stray
       user fragment hides that on the capture host, a bare CI runner silently renders grayscale.
       The two fallback dirs below are what keeps this file self-sufficient either way. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <!-- Scanned again (deduplicated) if the include above brought nothing: the pinned faces live in
       /usr/local/share/fonts/warsha-capture, and the baselines' metrics depend on finding them.
       No `fallback` attribute — fontconfig 2.13 rejects it on <dir> and would discard this whole
       file, which is precisely the failure this pin exists to avoid. -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>

  <!-- The AA mode, applied after the include so these assignments are final for every face. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
