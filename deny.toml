# cargo-deny configuration for the Warsha Rust workspace.
#
# Why this file exists
# -------------------
# ci.yml (`Rust (ubuntu|macos|windows)`) and release.yml (`Generate Artifacts`)
# run `cargo deny check`. With no config file cargo-deny logs "unable to find a
# config path, falling back to default config" and applies its built-in policy,
# whose `[licenses] allow` list is EMPTY — i.e. it denies every license in the
# graph. This file replaces that default with the license set this workspace
# actually resolves to, and nothing more.
#
# Evidence (measured, not guessed)
# -------------------------------
# Generated 2026-11-04 against the committed Cargo.lock (lock `version = 4`,
# which is also why the old container action failed to parse it):
#
#   cargo metadata --format-version 1              -> 579 packages, 17 terms
#   cargo metadata --format-version 1 --all-features -> 579 packages, 17 terms
#
# The two graphs are identical, so the list below is complete for cargo-deny's
# own `--all-features` fetch (the flag the previous action passed by default).
# 35 distinct raw license strings occur; 0 packages have no `license` field at
# all. Every entry below is an atomic SPDX id appearing in that graph and was
# validated against the SPDX license list (spdx/license-list-data
# licenses.json).
#
# The workspace's own crates contribute "PolyForm-Noncommercial-1.0.0": all ten
# members set `license = { workspace = true }`, inheriting
# Cargo.toml `[workspace.package] license = "PolyForm-Noncommercial-1.0.0"`.
#
# Slash-form strings ("MIT/Apache-2.0", "Apache-2.0/MIT", "Apache-2.0 / MIT",
# 34 crates) are a Cargo-ism, not SPDX; cargo-deny normalises "/" to an OR, so
# the two already-listed terms cover them.
#
# Deliberately NOT narrowed
# ------------------------
# LGPL-2.1-or-later and MPL-2.0 are copyleft and are listed as observed rather
# than special-cased away: they are genuinely reachable (r-efi ships
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later"; option-ext is "MPL-2.0" only). Under
# cargo-deny's default `copyleft = "warn"` they surface as warnings, not errors.
# "LLVM-exception" ("Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT":
# rustix, linux-raw-sys, io-lifetimes) needs no entry — it is an SPDX *exception*,
# not a license term.
#
# What is NOT asserted here
# ------------------------
# `[bans]` and `[sources]` are intentionally ABSENT, so those two checks run
# under cargo-deny's built-in defaults. Note the graph contains crates with
# more than one version in it, which the default `[bans] multiple-versions = "warn"`
# reports as warnings rather than errors, and that all 22 wildcard (`*`)
# requirements are workspace-internal path deps, not registry wildcards.
#
# `[advisories]` (version = 2) is configured explicitly below. Two unmaintained
# advisories were eliminated at the dependency level by removing unused
# `indicatif = "0.17"` (`number_prefix 0.4.0`, RUSTSEC-2025-0119) and narrowing
# `image = "0.25"` in `warsha-remote` to `default-features = false, features = ["png"]`
# (`paste 1.0.15` via `ravif`, RUSTSEC-2024-0436). The remaining four entries in
# `ignore` are non-vulnerability `unmaintained` notices pulled in exclusively
# through `keyring 1.2.1` (`secret-service 2.0.2 -> zbus 1.9.3`), which is pinned
# across `warsha-providers`, `warsha-relay`, and `warshad`.

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "Transitive unmaintained notice on instant 0.1.13 pulled in only via keyring 1.2.1 -> secret-service 2.0.2 -> zbus 1.9.3 -> fastrand 1.9.0 / async-io 1.13.0 (and parking_lot 0.11.2); paste (RUSTSEC-2024-0436) and number_prefix (RUSTSEC-2025-0119) were eliminated by narrowing image to png and removing unused indicatif." },
    { id = "RUSTSEC-2024-0388", reason = "Transitive unmaintained notice on derivative 2.2.0 pulled in only via keyring 1.2.1 -> secret-service 2.0.2 -> zbus 1.9.3; paste (RUSTSEC-2024-0436) and number_prefix (RUSTSEC-2025-0119) were eliminated by narrowing image to png and removing unused indicatif." },
    { id = "RUSTSEC-2026-0370", reason = "Transitive unmaintained notice on zvariant 2.10.0 pulled in only via keyring 1.2.1 -> secret-service 2.0.2 -> zbus 1.9.3; paste (RUSTSEC-2024-0436) and number_prefix (RUSTSEC-2025-0119) were eliminated by narrowing image to png and removing unused indicatif." },
    { id = "RUSTSEC-2026-0372", reason = "Transitive unmaintained notice on zvariant_derive 2.10.0 pulled in only via keyring 1.2.1 -> secret-service 2.0.2 -> zbus 1.9.3 -> zvariant 2.10.0; paste (RUSTSEC-2024-0436) and number_prefix (RUSTSEC-2025-0119) were eliminated by narrowing image to png and removing unused indicatif." },
]

[licenses]
version = 1
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "PolyForm-Noncommercial-1.0.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
