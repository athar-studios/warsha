[package]
name = "warsha-cli"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "CLI binary: warsha command"

[dependencies]
warsha-core = { path = "../warsha-core" }
warsha-providers = { path = "../warsha-providers" }
warsha-remote = { path = "../warsha-remote" }
warshad = { path = "../warshad" }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
jsonrpsee = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
which = "6.0"

[[bin]]
name = "warsha"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading"] }