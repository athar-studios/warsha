[package]
name = "warsha-store"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "SQLite persistence layer with migrations"

[dependencies]
warsha-core = { path = "../warsha-core" }
thiserror = { workspace = true }
anyhow = { workspace = true }
sqlx = { workspace = true }
# Pinned to the libsqlite3-sys 0.30 line that `sqlx` already links, so the
# workspace keeps exactly one native SQLite (`links = "sqlite3"`). A newer
# rusqlite would demand libsqlite3-sys 0.3x+ and fail the whole build.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = "1.4"