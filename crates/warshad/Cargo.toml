[package]
name = "warshad"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Daemon binary: local API (JSON-RPC over Unix socket / named pipe + localhost HTTP/WebSocket with token)"

[lints]
workspace = true

[dependencies]
warsha-core = { path = "../warsha-core" }
warsha-store = { path = "../warsha-store" }
warsha-providers = { path = "../warsha-providers" }
warsha-pipeline = { path = "../warsha-pipeline" }
warsha-backends = { path = "../warsha-backends" }
warsha-git = { path = "../warsha-git" }
warsha-remote = { path = "../warsha-remote" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = "0.5"
tower-http = { workspace = true }
jsonrpsee = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
keyring = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
fs2 = "0.4"
# R-EXT-3: the Scout's registry client is the daemon's only user of an HTTP client in
# production code (it was a dev-dependency before this packet).
reqwest = { workspace = true }

[[bin]]
name = "warshad"
path = "src/main.rs"

[dev-dependencies]
# The health probe's honesty test drops `runs.version` from a migrated store and re-reads it,
# which is the only way to build the pre-K2 schema in-process — a test-only need.
sqlx = { workspace = true }
tempfile = { workspace = true }
# R-F3e: `tests::clean1_swarm` drives `ScriptedBackend` and the builtin materialize fixture.
# Dev-only, so resolver 2 keeps the feature out of a normal `cargo build -p warshad`.
warsha-backends = { path = "../warsha-backends", features = ["test-fixtures"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading", "Win32_Security_Authorization"] }