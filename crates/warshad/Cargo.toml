[package]
name = "warshad"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Daemon binary: local API (JSON-RPC over Unix socket / named pipe + localhost HTTP/WebSocket with token)"

[dependencies]
warsha-core = { path = "../warsha-core" }
warsha-store = { path = "../warsha-store" }
warsha-providers = { path = "../warsha-providers" }
warsha-pipeline = { path = "../warsha-pipeline" }
warsha-backends = { path = "../warsha-backends" }
warsha-git = { path = "../warsha-git" }
warsha-remote = { path = "../warsha-remote" }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = "0.5"
tower-http = { workspace = true }
jsonrpsee = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
keyring = { workspace = true }
ulid = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
fs2 = "0.4"

[[bin]]
name = "warshad"
path = "src/main.rs"

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }
pretty_assertions = "1.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Threading"] }